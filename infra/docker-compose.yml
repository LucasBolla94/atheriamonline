# The database and cache for Atheriam.
#
# Start them with:
#   docker compose -f infra/docker-compose.yml up -d
# Stop them with:
#   docker compose -f infra/docker-compose.yml down
#
# The data is kept in named volumes, so stopping the services does not delete
# anything.
#
# Both services are published to 127.0.0.1 only. They listened on every address
# once, which on a machine with a public IP meant the whole internet could
# reach the database. Nothing outside this machine needs them: the API and the
# world server run here, and players only ever talk to Caddy.

name: atheriam

services:
  postgres:
    image: postgres:17-alpine
    container_name: atheriam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atheriam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-atheriam}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-atheriam} -d ${POSTGRES_DB:-atheriam}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: atheriam-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
